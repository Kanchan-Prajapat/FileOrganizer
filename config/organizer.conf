# ==========================================
# Linux File Organizer Configuration
# ==========================================


# --- Original Categories ---
IMAGES="jpg jpeg png gif svg ico tiff tif bmp webp heic"
DOCUMENTS="pdf doc docx txt odt xls xlsx ppt pptx"
VIDEOS="mp4 mkv avi mov wmv flv"
MUSIC="mp3 wav flac aac ogg"
ARCHIVES="zip tar gz rar 7z"
SCRIPTS="sh py js c cpp java"

# --- System and Data Categories ---
CONFIGS="json yaml yml xml ini cfg conf toml env"
DATABASES="db sqlite sqlite3 sql mdb accdb"
LOGS="log err out back"

# --- Web and Text Categories ---
WEB="html htm css sass scss php asp aspx ts jsx tsx"
EBOOKS="epub mobi azw3 djvu"
FONTS="ttf otf woff woff2 eot"

# --- Design and Media Categories ---
DESIGN="psd ai xcf fig sketch indd"
CAD_3D="stl obj fbx blend step igs dxf"
DISK_IMAGES="iso img dmg vmdk qcow2 ova"

# --- Executables and Security Categories ---
COMPILED="exe msi app deb rpm bin jar"
CRYPTO="pem crt key csr gpg asc"

# --- Fallback Category ---
# Any file extension not matching the lists above will automatically 
# be routed to this folder name by the organizer script logic.
OTHERS="Others"
